apiVersion: v1
kind: Service
metadata:
  name: {{ include "flyiam.fullname" . }}
  labels:
    {{- include "flyiam.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.sessionAffinity }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  # 必须限定 component=server：内置 Casdoor 的 Pod 同样带有
  # app.kubernetes.io/name=flyiam + instance 标签，若不限定会把 Casdoor
  # 也选进本 Service 的 Endpoints，导致访问本应用时随机跳到 Casdoor 页面。
  selector:
    {{- include "flyiam.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server

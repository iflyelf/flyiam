  <title>FlyIAM - 统一用户管理系统</title>
  <script>
    // 首屏应用主题，避免主题闪烁（FOUC）
    (function () {
      try {
        var legacy = { light: 'warm', blue: 'cool' };
        var t = localStorage.getItem('flyiam_theme') || localStorage.getItem('theme');
        if (t && legacy[t]) t = legacy[t];
        if (t !== 'warm' && t !== 'cool' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'warm';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'warm');
      }
    })();
  </script>

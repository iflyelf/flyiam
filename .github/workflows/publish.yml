name: 构建并发布(latest)

# 推送到 main 或手动触发即构建, 二进制与镜像统一发布到 latest
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      build:
        description: 'build flyiam'
        required: true
        default: 'build flyiam'
  watch:
    types: [started]

jobs:
  # 编译多架构二进制并更新 latest Release
  binaries:
    name: 二进制文件
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.26'
          cache: true

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        run: |
          cd web
          npm config set registry https://registry.npmmirror.com
          npm ci
          npm run build

      - name: 计算版本号
        id: ver
        run: |
          echo "version=latest-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: 交叉编译
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_TIME: ${{ steps.ver.outputs.build_time }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.GitCommit=${GIT_COMMIT:0:7}"

          # Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/flyiam-linux-amd64 ./cmd/api

          # Linux arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/flyiam-linux-arm64 ./cmd/api

          # macOS amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/flyiam-darwin-amd64 ./cmd/api

          # macOS arm64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/flyiam-darwin-arm64 ./cmd/api

          # Windows amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/flyiam-windows-amd64.exe ./cmd/api

          # 打包和校验
          cd dist
          for f in flyiam-linux-* flyiam-darwin-*; do
            tar -czf "${f}.tar.gz" "$f"
            sha256sum "${f}.tar.gz" >> checksums.txt
          done
          zip flyiam-windows-amd64.zip flyiam-windows-amd64.exe
          sha256sum flyiam-windows-amd64.zip >> checksums.txt

      - name: 发布到 latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          prerelease: false
          body: |
            ## FlyIAM - Latest Version

            > 统一用户管理系统（内置 Casdoor 认证中心）

            **版本**: ${{ steps.ver.outputs.version }}
            **提交**: ${{ github.sha }}
            **构建时间**: ${{ github.event.head_commit.timestamp }}

            ### 📥 下载

            - **Linux (amd64)**: `flyiam-linux-amd64.tar.gz`
            - **Linux (arm64)**: `flyiam-linux-arm64.tar.gz`
            - **macOS (amd64)**: `flyiam-darwin-amd64.tar.gz`
            - **macOS (arm64)**: `flyiam-darwin-arm64.tar.gz`
            - **Windows (amd64)**: `flyiam-windows-amd64.zip`

            ### 🐳 Docker 镜像

            ```bash
            docker pull iflyelf/flyiam:latest
            ```

            ### 🚀 快速开始

            ```bash
            # 下载并解压
            tar xzf flyiam-linux-amd64.tar.gz
            chmod +x flyiam-linux-amd64

            # 设置环境变量
            export DATABASE_URL="postgresql://user:pass@host:5432/flyiam?sslmode=disable"
            export JWT_SECRET="your-jwt-secret-at-least-32-chars"
            export ADMIN_PASSWORD="your_password"
            export CASDOOR_ENDPOINT="http://casdoor:8000"

            # 运行
            ./flyiam-linux-amd64 -c etc/config.yaml
            ```

            ### ✨ 主要功能

            - ✅ 零硬编码 - 所有配置通过配置文件与环境变量
            - ✅ 用户管理 - 增删改查、批量删除、密码重置
            - ✅ 组织与权限 - 角色 / 团队 / 授权
            - ✅ 多数据源同步 - 定时同步、离职删除、受保护用户
            - ✅ Casdoor 集成 - OAuth2 登录、自动初始化
            - ✅ 单二进制交付 - 前端嵌入、单端口

            ### 📝 环境变量

            必填:
            - `DATABASE_URL` - PostgreSQL 连接字符串
            - `JWT_SECRET` - JWT 密钥（≥32 位）
            - `ADMIN_PASSWORD` - 管理员密码
            - `CASDOOR_ENDPOINT` - Casdoor 地址

            可选:
            - `SERVER_PORT` - 服务端口 (默认: 8081)
            - `REDIS_HOST` / `REDIS_PASSWORD` - Redis 缓存
            - `CASDOOR_AUTO_SETUP` - 自动初始化 Casdoor (默认: true)
            - `CASDOOR_DEFAULT_PASSWORD` - 新用户默认密码 (默认: ysyh!9Sky)
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # 构建并推送多架构镜像到 latest
  docker:
    name: Docker镜像
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    needs: binaries
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算版本号
        id: ver
        run: |
          echo "version=latest-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: 安装 docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: 登录 DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并推送镜像(仅 latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            BUILD_TIME=${{ steps.ver.outputs.build_time }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flyiam:latest
            ${{ secrets.DOCKER_USERNAME }}/flyiam:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 清理旧的 workflow 运行记录
        uses: Mattraks/delete-workflow-runs@main
        with:
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 3
